[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sand-atlas-dem"
version = "0.1.0a1"
description = "Slang/Metal level-set DEM research laboratory for measured grain shapes"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["numpy>=2", "scipy>=1.14", "trimesh>=4", "rtree>=1.3", "h5py>=3.12", "slangpy==0.43.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
view = ["pyvista>=0.46,<0.50", "imageio>=2.36", "imageio-ffmpeg>=0.6"]
inspect = ["matplotlib>=3.9", "meshio>=5"]

[project.scripts]
sand-dem = "sand_atlas_dem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sand_atlas_dem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: requires a graphical session and optional view dependencies", "metal: runs compiled Slang on an actual Metal device (serial)"]
